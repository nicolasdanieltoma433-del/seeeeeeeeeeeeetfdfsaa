name: TickSaver

on:
  workflow_dispatch:
  push:
    paths:
      - "TickSaver/**"
      - ".github/workflows/ticksaver.yml"

jobs:
  core-tests:
    name: Tests de core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compilar y correr tests
        working-directory: TickSaver
        run: |
          cmake -S tests -B build-tests
          cmake --build build-tests
          ./build-tests/core_tests

  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      # Checkout en una subcarpeta: el repo tiene su propia carpeta "output/"
      # que choca con la que crea build-geode-mod en la raíz del workspace.
      - uses: actions/checkout@v7
        with:
          path: repo

      - name: Compilar el mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: repo/TickSaver
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Empaquetar .geode
    runs-on: ubuntu-latest
    needs: ["build"]

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v7
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
