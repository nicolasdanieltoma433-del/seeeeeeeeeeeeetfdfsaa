name: ClickIndicators

on:
  workflow_dispatch:
  push:
    paths:
      - "ClickIndicators/**"
      - ".github/workflows/clickindicators.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      # Checkout en una subcarpeta: el repo tiene su propia carpeta "output/"
      # que choca con la que crea build-geode-mod en la raíz del workspace.
      - uses: actions/checkout@v7
        with:
          path: repo

      - name: Compilar el mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: repo/ClickIndicators
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Empaquetar .geode
    runs-on: ubuntu-latest
    needs: ["build"]
    permissions:
      contents: write

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v7
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}

      # Guarda el .geode compilado en la rama (ClickIndicators/dist/) para poder
      # descargarlo sin entrar a Actions. Los push con GITHUB_TOKEN no
      # vuelven a disparar el workflow.
      - uses: actions/checkout@v7
        with:
          path: repo

      - name: Guardar .geode en la rama
        run: |
          mkdir -p repo/ClickIndicators/dist
          cp "${{ steps.build.outputs.build-output }}"/*.geode repo/ClickIndicators/dist/
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ClickIndicators/dist
          git diff --cached --quiet || git commit -m "Build de ClickIndicators (${GITHUB_SHA::7})"
          git push
